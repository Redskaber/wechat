name: Daily update

# 每日凌晨 03:00 (Asia/Shanghai = UTC+8, 即 UTC 19:00 前一天) 自动检查 WeChat 上游
# 是否有新版本；如有，刷新 sources.nix 并提交 PR。
#
# 也可以通过 GitHub Actions UI 手动触发（workflow_dispatch）。

on:
  schedule:
    # 分钟 小时 日 月 周 — 03:00 Asia/Shanghai == 19:00 UTC 前一天
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh sources.nix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Configure git
        run: |
          # CI bot identity is tied to the maintainer (redskaber).
          git config --global user.name  "redskaber-bot"
          git config --global user.email "redskaber@users.noreply.github.com"

      - name: Snapshot current sources
        id: before
        run: |
          echo "old_sha=$(sha256sum sources.nix | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Run update.sh
        run: |
          ./update.sh

      - name: Verify flake still evaluates
        run: |
          nix flake check --no-build

      - name: Snapshot new sources
        id: after
        run: |
          echo "new_sha=$(sha256sum sources.nix | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create update branch & PR
        if: steps.before.outputs.old_sha != steps.after.outputs.new_sha
        run: |
          BR="auto-update/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          git add sources.nix
          git commit -m "chore(sources): auto-update $(date -u +%Y-%m-%d)"
          git push origin "$BR"
          PR_BODY=$(cat <<EOF
          Auto-generated by \`.github/workflows/daily-update.yml\`.

          - Triggered: $(date -u)
          - Trigger: schedule

          Diff of \`sources.nix\`:
          \`\`\`diff
          $(git diff HEAD~1 -- sources.nix)
          \`\`\`
          EOF
          )
          gh pr create \
            --title "chore(sources): auto-update $(date -u +%Y-%m-%d)" \
            --body "$PR_BODY" \
            --base main \
            --head "$BR" \
            --label auto-update || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary (no changes)
        if: steps.before.outputs.old_sha == steps.after.outputs.new_sha
        run: echo "No upstream changes detected."
